<svg viewBox="0 0 800 450" width="100%" xmlns="http://www.w3.org/2000/svg">
  <style>
    .text-title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: bold; fill: #111827; text-anchor: middle; }
    .text-math { font-family: "Courier New", Courier, monospace; font-size: 20px; font-weight: bold; fill: #be185d; text-anchor: middle; }
    .text-desc { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; fill: #374151; text-anchor: middle; }
    .circle-fill { fill: #3b82f6; opacity: 0.2; stroke: #2563eb; stroke-width: 2; }
    .circle-compare { fill: #ef4444; opacity: 0.8; }
    .grid-line { stroke: #d1d5db; stroke-width: 1; }
  </style>

  <text x="400" y="70" class="text-math">A = π · r²</text>

  <g transform="translate(200, 220)">
    <circle cx="0" cy="0" r="50" class="circle-compare" />
    <line x1="0" y1="0" x2="50" y2="0" stroke="#7f1d1d" stroke-width="2" />
    <text x="25" y="-10" font-family="sans-serif" font-size="14" fill="#7f1d1d">r=2</text>
  </g>
  <text x="200" y="320" class="text-desc">If r = 2</text>
  <text x="200" y="350" class="text-math">A = 4π</text>

  <g transform="translate(550, 220)">
    <circle cx="0" cy="0" r="100" class="circle-fill" />
    <line x1="0" y1="0" x2="100" y2="0" stroke="#1e3a8a" stroke-width="2" />
    <text x="50" y="-10" font-family="sans-serif" font-size="16" fill="#1e3a8a">r=4</text>
    
    <circle cx="-50" cy="-50" r="50" class="circle-compare" opacity="0.4" />
    <circle cx="50" cy="-50" r="50" class="circle-compare" opacity="0.4" />
    <circle cx="-50" cy="50" r="50" class="circle-compare" opacity="0.4" />
    <circle cx="50" cy="50" r="50" class="circle-compare" opacity="0.4" />
    
    <line x1="-100" y1="0" x2="100" y2="0" class="grid-line" />
    <line x1="0" y1="-100" x2="0" y2="100" class="grid-line" />
  </g>

  <text x="550" y="360" class="text-desc">If r = 4</text>
  <text x="550" y="390" class="text-math">A = 16π = 4 · (4π)</text>
</svg>
